<svg xmlns="http://www.w3.org/2000/svg" width="380" height="240" viewBox="0 0 380 240" role="img" aria-labelledby="t">
  <title id="t">Terriermon pixel-art partner sprite</title>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect y="0" width="4" height="1" fill="#000000" opacity="0.12"/>
    </pattern>
    <style>
      .bob { animation: bob 2.8s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .flick { animation: flick 7s steps(1, end) infinite; }
      @keyframes flick { 0%, 95%, 100% { opacity: 1; } 96% { opacity: 0.82; } 97% { opacity: 1; } 98% { opacity: 0.92; } }
      .shadow { animation: shadowPulse 2.8s ease-in-out infinite; transform-origin: 190px 224px; }
      @keyframes shadowPulse { 0%, 100% { transform: scaleX(1); opacity: 0.3; } 50% { transform: scaleX(0.88); opacity: 0.18; } }
      .spark { animation: sparkle 3.6s ease-in-out infinite; }
      .spark2 { animation-delay: -1.2s; }
      .spark3 { animation-delay: -2.4s; }
      @keyframes sparkle { 0%, 100% { opacity: 0.15; transform: translateY(0); } 50% { opacity: 0.9; transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) { .bob, .flick, .shadow, .spark { animation: none; } }
    </style>
  </defs>

  <ellipse class="shadow" cx="190" cy="224" rx="96" ry="6" fill="#00e5ff" opacity="0.28"/>

  <g class="bob">
    <g class="flick">
      <image href="data:image/png;base64," x="10" y="10" width="360" height="220"/>
      <rect x="10" y="10" width="360" height="220" fill="url(#scan)" opacity="0.5"/>
    </g>
  </g>

  <g class="spark"><rect x="18" y="40" width="6" height="6" fill="#00e5ff" opacity="0.9"/></g>
  <g class="spark spark2"><rect x="350" y="86" width="5" height="5" fill="#ff2e97" opacity="0.9"/></g>
  <g class="spark spark3"><rect x="336" y="22" width="4" height="4" fill="#39ff14" opacity="0.9"/></g>
</svg>
