<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-labelledby="digiTitle">
  <title id="digiTitle">Pixel Digimon partner - orange digital monster with green eyes</title>
  <defs>
    <style>
      .bob { animation: bob 2.6s ease-in-out infinite; }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .eye { animation: blink 5.2s steps(1, end) infinite; }
      @keyframes blink {
        0%, 92%, 100% { opacity: 1; }
        93%, 95% { opacity: 0.1; }
      }
      .shadow { animation: shadowPulse 2.6s ease-in-out infinite; transform-origin: 90px 176px; }
      @keyframes shadowPulse {
        0%, 100% { transform: scaleX(1); opacity: 0.35; }
        50% { transform: scaleX(0.86); opacity: 0.22; }
      }
      .spark { animation: sparkle 3.6s ease-in-out infinite; }
      .spark2 { animation-delay: -1.2s; }
      .spark3 { animation-delay: -2.4s; }
      @keyframes sparkle {
        0%, 100% { opacity: 0.15; transform: translateY(0); }
        50% { opacity: 0.9; transform: translateY(-4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bob, .eye, .shadow, .spark { animation: none; }
      }
    </style>
  </defs>

  <ellipse class="shadow" cx="90" cy="172" rx="36" ry="5" fill="#00e5ff" opacity="0.18"/>

